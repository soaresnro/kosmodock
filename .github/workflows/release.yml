# Builds, tests and packages Kosmodock.
#
# - Pull requests and manual runs: test + package, uploaded as a workflow artifact.
# - Tags `v*` (e.g. v1.0.0): the same, then a GitHub Release with the .dmg, .zip
#   and SHA256SUMS.txt.
#
# With these repository secrets the app and disk image are signed with a
# Developer ID, notarized and stapled; without them the build is unsigned and
# the release notes explain how to open it:
#   MACOS_DEVELOPER_ID_P12           base64 of a .p12 with the "Developer ID Application" cert + key
#   MACOS_DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   MACOS_NOTARY_APPLE_ID            Apple ID used for notarization
#   MACOS_NOTARY_TEAM_ID             Developer Team ID
#   MACOS_NOTARY_PASSWORD            app-specific password for that Apple ID
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    env:
      DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Check translations
        run: python3 scripts/check_localizations.py

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "::error::No Developer ID Application identity in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Signing status
        id: signing
        run: echo "signed=$([ -n "${SIGN_IDENTITY:-}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Bundle
        # bundle.sh signs ad-hoc when SIGN_IDENTITY is unset.
        run: bash scripts/bundle.sh

      - name: Notarize app
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent Kosmodock.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple Kosmodock.app

      - name: Package
        run: |
          mkdir -p dist dmg
          ditto -c -k --keepParent Kosmodock.app "dist/Kosmodock-$VERSION.zip"
          cp -R Kosmodock.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil occasionally reports "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname "Kosmodock" -srcfolder dmg -ov -format UDZO "dist/Kosmodock-$VERSION.dmg" && break
            sleep 5
          done
          test -f "dist/Kosmodock-$VERSION.dmg"

      - name: Sign and notarize disk image
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          codesign --sign "$SIGN_IDENTITY" --timestamp "dist/Kosmodock-$VERSION.dmg"
          xcrun notarytool submit "dist/Kosmodock-$VERSION.dmg" --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple "dist/Kosmodock-$VERSION.dmg"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Kosmodock-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kosmodock-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "Signed with a Developer ID and notarized by Apple." > notes.md
          else
            cat > notes.md <<'NOTES'
          > [!WARNING]
          > This build is **not notarized**. macOS blocks it the first time you open it: go to **System Settings → Privacy & Security → Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Kosmodock.app`.
          NOTES
          fi
          printf '\nVerify downloads with `shasum -a 256 -c SHA256SUMS.txt`.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Kosmodock $VERSION" --notes-file notes.md --generate-notes
